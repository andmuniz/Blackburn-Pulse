<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo Arredondado -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />
  
  <!-- Círculo interno decorativo com pulso -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="16 8" />
  
  <!-- Linha de Pulso Eletrocardiograma / Sensor -->
  <path d="M 90 260 L 170 260 L 195 210 L 225 310 L 255 170 L 285 330 L 315 230 L 340 260 L 422 260" 
        fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
        
  <!-- Raio Principal de Alta Tensão / Blackburn Shallenberger -->
  <path d="M 280 90 L 170 270 L 250 270 L 220 422 L 350 230 L 270 230 Z" 
        fill="url(#boltGrad)" filter="url(#glow)" />
</svg>

